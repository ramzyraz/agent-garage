name: builder-session

# Triggered by a scheduler on the owner's Mac (launchd) or by hand.
# GitHub's own cron never fired for this repo, so it isn't used.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Force an agent (leave empty to alternate)"
        type: choice
        options: ["", claude, codex]
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: builder-session
      cancel-in-progress: false
    outputs:
      ran: ${{ steps.guard.outputs.run }}
      agent: ${{ steps.guard.outputs.agent }}
      codex_only: ${{ steps.guard.outputs.codex_only }}
    steps:
      - uses: actions/checkout@v4

      # Odd sessions go to Claude, even ones to Codex. If the chosen agent has
      # no credentials, the other one runs.
      - name: Pick agent
        id: guard
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_CODEX: ${{ secrets.CODEX_AUTH_JSON != '' }}
          FORCED: ${{ inputs.agent }}
        run: |
          n=$(ls projects/builder/log/session-*.md 2>/dev/null | wc -l)
          session=$((n + 1))
          # Temporary Claude quota workaround, expires at midnight in Pakistan.
          codex_only=false
          if [ "$(TZ=Asia/Karachi date +%F)" = 2026-10-08 ]; then codex_only=true; fi
          echo "codex_only=$codex_only" >> "$GITHUB_OUTPUT"
          if [ "$codex_only" = true ]; then agent=codex
          elif [ -n "$FORCED" ]; then agent="$FORCED"
          elif [ $((session % 2)) -eq 1 ]; then agent=claude
          else agent=codex; fi
          if [ "$agent" = claude ] && [ "$HAS_CLAUDE" != true ]; then agent=codex; fi
          if [ "$agent" = codex ] && [ "$HAS_CODEX" != true ]; then agent=claude; fi
          if [ "$agent" = claude ] && [ "$HAS_CLAUDE" != true ]; then agent=none; fi
          if [ "$codex_only" = true ] && [ "$HAS_CODEX" != true ]; then agent=none; fi

          if [ "$agent" = none ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: sessions so far=$n, claude=$HAS_CLAUDE, codex=$HAS_CODEX"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "agent=$agent" >> "$GITHUB_OUTPUT"
            echo "Session $session -> $agent"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: 22

      - name: Configure git
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "builder-agent (${{ steps.guard.outputs.agent }})"
          git config user.email "52238175+ramzyraz@users.noreply.github.com"

      - name: Run Claude
        if: steps.guard.outputs.agent == 'claude'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # Hitting the step cap shouldn't throw the session's work away: commit what's there.
          if ! claude -p "You are Claude Code. Read projects/builder/AGENT.md and follow it. Run this session." \
            --model opus \
            --max-turns 80 \
            --dangerously-skip-permissions; then
            echo "::warning::Claude stopped early (likely the step cap); committing its partial work."
          fi

      # Codex uses the ChatGPT login from auth.json. Codex may refresh the
      # tokens during the run, so the file is saved back to the secret after.
      - name: Restore Codex login
        if: steps.guard.outputs.agent == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex && chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 > /tmp/auth.sha

      - name: Run Codex
        if: steps.guard.outputs.agent == 'codex'
        run: |
          npm install -g @openai/codex
          codex exec --dangerously-bypass-approvals-and-sandbox \
            -m gpt-6.1-sol -c model_reasoning_effort=high \
            "You are OpenAI Codex. Read projects/builder/AGENT.md and follow it. Run this session."

      # Needs a fine-grained token (this repo only, Secrets: read/write) stored
      # as SECRETS_PAT. Without it this is skipped and the original login is reused.
      - name: Save refreshed Codex login
        if: always() && steps.guard.outputs.agent == 'codex'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          [ -f ~/.codex/auth.json ] || exit 0
          if sha256sum ~/.codex/auth.json | cut -d' ' -f1 | cmp -s - /tmp/auth.sha; then
            echo "Login unchanged."; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Codex refreshed its login but SECRETS_PAT is not set; the stored login may expire."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json
          echo "Saved refreshed login."

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        run: |
          rm -rf ~/.codex
          git add -A
          git diff --cached --quiet || git commit -m "Session wrap-up (auto)"
          # The human may have pushed during the session. Rebase onto that; if it
          # conflicts, keep the session's work on its own branch instead of losing it.
          if git pull --rebase origin main; then
            git push
          else
            git rebase --abort
            branch="session-conflict-${GITHUB_RUN_ID}"
            git push origin HEAD:"$branch"
            echo "::error::Conflicted with a push to main. Session work saved to branch $branch."
            exit 1
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  # Turn on by setting the repo variable PAGES_ENABLED=true.
  deploy-site:
    needs: session
    if: needs.session.outputs.ran == 'true' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check for site
        id: site
        run: echo "exists=$([ -d site ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.exists == 'true'
        with:
          path: site
      - id: deployment
        if: steps.site.outputs.exists == 'true'
        uses: actions/deploy-pages@v4

  # An independent critic plays the freshly deployed site and writes a review the
  # builders read next session. It runs in an empty folder: no code, no logs, just the URL.
  # The other provider reviews: Codex reviews Claude's sessions and vice versa.
  evaluate:
    needs: [session, deploy-site]
    if: needs.session.outputs.ran == 'true' && needs.deploy-site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare
        id: prep
        run: |
          n=$(ls projects/builder/log/session-*.md | wc -l)
          echo "n=$(printf %02d "$n")" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.session.outputs.codex_only }}" = true ] || [ "${{ needs.session.outputs.agent }}" = claude ]; then
            echo "reviewer=codex"
          else
            echo "reviewer=claude"
          fi >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/eval && cp projects/builder/EVALUATOR.md /tmp/eval/
          sleep 60   # let the Pages CDN pick up the new deploy

      - name: Review (Claude)
        if: steps.prep.outputs.reviewer == 'claude'
        working-directory: /tmp/eval
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude -p "You are Claude Code, the evaluator. Read EVALUATOR.md and follow it. This is the review after session ${{ steps.prep.outputs.n }}." \
            --model sonnet --max-turns 30 --dangerously-skip-permissions

      - name: Restore Codex login
        if: steps.prep.outputs.reviewer == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex && chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 > /tmp/auth.sha

      - name: Review (Codex)
        if: steps.prep.outputs.reviewer == 'codex'
        working-directory: /tmp/eval
        run: |
          npm install -g @openai/codex > /dev/null 2>&1
          codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox \
            -m gpt-6.1-sol -c model_reasoning_effort=medium \
            "You are OpenAI Codex, the evaluator. Read EVALUATOR.md and follow it. This is the review after session ${{ steps.prep.outputs.n }}."

      - name: Save refreshed Codex login
        if: always() && steps.prep.outputs.reviewer == 'codex'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          [ -f ~/.codex/auth.json ] && [ -n "$GH_TOKEN" ] || exit 0
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 | cmp -s - /tmp/auth.sha && exit 0
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json

      - name: Commit the review
        run: |
          rm -rf ~/.codex
          [ -f /tmp/eval/feedback.md ] || { echo "::error::The evaluator wrote no feedback.md"; exit 1; }
          mkdir -p projects/builder/feedback
          cp /tmp/eval/feedback.md "projects/builder/feedback/after-session-${{ steps.prep.outputs.n }}.md"
          git config user.name "evaluator (${{ steps.prep.outputs.reviewer }})"
          git config user.email "52238175+ramzyraz@users.noreply.github.com"
          git add projects/builder/feedback
          git commit -q -m "Review after session ${{ steps.prep.outputs.n }} (${{ steps.prep.outputs.reviewer }})"
          git pull -q --rebase origin main && git push -q
