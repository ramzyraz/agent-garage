name: story-chapter

# One chapter per run: Claude writes it, Codex edits it.
# Plot planning lives in story/vault.enc (encrypted); it's only decrypted inside this job.
# Agent output is discarded so the public Actions logs can't spoil the story.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: story-chapter
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "story-agents"
          git config user.email "52238175+ramzyraz@users.noreply.github.com"

      - name: Unlock the story plan
        env:
          STORY_KEY: ${{ secrets.STORY_KEY }}
        run: |
          [ -n "$STORY_KEY" ] || { echo "::error::STORY_KEY secret is missing"; exit 1; }
          mkdir -p story/.secret
          if [ -f story/vault.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STORY_KEY -in story/vault.enc | tar -xzf - -C story/.secret
          fi

      - name: Author (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          if claude -p "You are the AUTHOR (Claude Code). Read story/STORY.md and follow it. Write the next chapter." \
              --model sonnet --max-turns 40 --dangerously-skip-permissions > /dev/null 2>&1; then
            echo "Author finished."
          else
            echo "::error::Author run failed (output hidden to avoid spoilers)."; exit 1
          fi

      - name: Restore Codex login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex && chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 > /tmp/auth.sha

      - name: Editor (Codex)
        run: |
          npm install -g @openai/codex > /dev/null 2>&1
          if codex exec --dangerously-bypass-approvals-and-sandbox \
              -m gpt-6-luna -c model_reasoning_effort=medium \
              "You are the EDITOR (OpenAI Codex). Read story/STORY.md and follow it. Edit the chapter the author just wrote." \
              > /dev/null 2>&1; then
            echo "Editor finished."
          else
            echo "::warning::Editor run failed; the chapter is published unedited."
          fi

      - name: Save refreshed Codex login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          [ -f ~/.codex/auth.json ] && [ -n "$GH_TOKEN" ] || exit 0
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 | cmp -s - /tmp/auth.sha && exit 0
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json

      - name: Lock the plan, build the chapter list, commit
        env:
          STORY_KEY: ${{ secrets.STORY_KEY }}
        run: |
          tar -czf - -C story/.secret . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STORY_KEY -out story/vault.enc
          rm -rf story/.secret ~/.codex
          node story/build-manifest.mjs
          git add -A
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          n=$(node -e 'const c=require("./site/story/chapters.json");const l=c[c.length-1];console.log(l?`Book ${l.book}, chapter ${l.chapter}`:"Story setup")')
          git commit -q -m "$n"
          if git pull -q --rebase origin main; then
            git push -q
          else
            git rebase --abort
            git push -q origin HEAD:"story-conflict-${GITHUB_RUN_ID}"
            echo "::error::Conflict with main; saved to branch story-conflict-${GITHUB_RUN_ID}."
            exit 1
          fi

  deploy-site:
    needs: chapter
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
