name: story-chapter

# Up to 3 chapters per run; each one written by Claude, then edited by Codex.
# Stops for good once the author marks the book complete in site/story/book.json.
# Plot planning lives in projects/story/vault.enc (encrypted); it's only decrypted inside this job.
# Agent output is discarded so the public Actions logs can't spoil the story.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: story-chapter
      cancel-in-progress: false
    outputs:
      done: ${{ steps.guard.outputs.done }}
      wrote: ${{ steps.write.outputs.wrote }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop if the book is finished
        id: guard
        run: |
          if node -e 'const b=require("./site/story/book.json");process.exit((b.books||[]).some(x=>x.complete)?0:1)'; then
            echo "The book is complete. Nothing to write."; echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.done == 'false'
        with:
          node-version: 22

      - name: Configure git
        if: steps.guard.outputs.done == 'false'
        run: |
          git config user.name "story-agents"
          git config user.email "52238175+ramzyraz@users.noreply.github.com"

      - name: Unlock the story plan
        if: steps.guard.outputs.done == 'false'
        env:
          STORY_KEY: ${{ secrets.STORY_KEY }}
        run: |
          [ -n "$STORY_KEY" ] || { echo "::error::STORY_KEY secret is missing"; exit 1; }
          mkdir -p projects/story/.secret
          if [ -f projects/story/vault.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STORY_KEY -in projects/story/vault.enc | tar -xzf - -C projects/story/.secret
          fi

      - name: Restore Codex login
        if: steps.guard.outputs.done == 'false'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p ~/.codex && chmod 700 ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 > /tmp/auth.sha

      - name: Write and edit up to 3 chapters
        id: write
        if: steps.guard.outputs.done == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex > /dev/null 2>&1
          complete() { node -e 'const b=require("./site/story/book.json");process.exit((b.books||[]).some(x=>x.complete)?0:1)'; }
          for i in 1 2 3; do
            status=0
            python3 .github/scripts/run-story-author.py || status=$?
            if [ "$status" = 75 ]; then
              echo "::warning::Skipping remaining chapters until Claude quota is available."
              break
            elif [ "$status" != 0 ]; then
              if [ "$i" = 1 ]; then exit "$status"; fi
              echo "::warning::Author run $i failed; keeping the chapters written so far."; break
            fi
            echo "wrote=true" >> "$GITHUB_OUTPUT"
            echo "Chapter $i written."
            if codex exec --dangerously-bypass-approvals-and-sandbox \
                -m gpt-6-luna -c model_reasoning_effort=medium \
                "You are the EDITOR (OpenAI Codex). Read projects/story/STORY.md and follow it. Edit the chapter the author just wrote." \
                > /dev/null 2>&1; then
              echo "Chapter $i edited."
            else
              echo "::warning::Editor failed on chapter $i; it's published unedited."
            fi
            if complete; then echo "The book is complete."; break; fi
          done

      - name: Save refreshed Codex login
        if: always() && steps.guard.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          [ -f ~/.codex/auth.json ] && [ -n "$GH_TOKEN" ] || exit 0
          sha256sum ~/.codex/auth.json | cut -d' ' -f1 | cmp -s - /tmp/auth.sha && exit 0
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" < ~/.codex/auth.json

      - name: Lock the plan, build the chapter list, commit
        if: steps.write.outputs.wrote == 'true'
        env:
          STORY_KEY: ${{ secrets.STORY_KEY }}
        run: |
          tar -czf - -C projects/story/.secret . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STORY_KEY -out projects/story/vault.enc
          rm -rf projects/story/.secret ~/.codex
          node projects/story/build-manifest.mjs
          git add -A
          n=$(node -e 'const c=require("./site/story/chapters.json");const l=c[c.length-1];console.log(l?`Book ${l.book}, chapter ${l.chapter}`:"Story setup")')
          # An agent may have committed on its own; push whatever is ahead of origin.
          git diff --cached --quiet || git commit -q -m "$n"
          [ -n "$(git log origin/main..HEAD --oneline)" ] || { echo "Nothing new."; exit 0; }
          if git pull -q --rebase origin main; then
            git push -q
          else
            git rebase --abort
            git push -q origin HEAD:"story-conflict-${GITHUB_RUN_ID}"
            echo "::error::Conflict with main; saved to branch story-conflict-${GITHUB_RUN_ID}."
            exit 1
          fi

      - name: Remove private runtime files
        if: always()
        run: rm -rf projects/story/.secret ~/.codex

  deploy-site:
    needs: chapter
    if: vars.PAGES_ENABLED == 'true' && needs.chapter.outputs.wrote == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
