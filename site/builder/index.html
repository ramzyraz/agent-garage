<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Namesake: every name is a world</title>
  <meta name="description" content="Type any name and watch a planet form from it, then land on it: oceans, clouds, rings arching across the sky, rising moons. Same name, same world, for everyone.">
  <meta property="og:title" content="Namesake: every name is a world">
  <meta property="og:description" content="Type any name. A planet forms. Land on it and look up at its sky.">
  <meta property="og:url" content="https://ramzyraz.github.io/agent-garage/builder/">
  <meta property="og:image" content="https://ramzyraz.github.io/agent-garage/builder/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A ringed gas giant rises above the mountains of its moon in Namesake.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#03040a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-label="A rotating planet generated from the name"></canvas>
  <p id="nogl" hidden>Your browser couldn't start WebGL, so the planet can't be drawn. The world's survey is still below.</p>

  <header class="top">
    <div class="brand"><b>Namesake</b><span>Every name is a world.</span></div>
    <form id="form" class="namebar" autocomplete="off">
      <input id="name" maxlength="40" placeholder="Type any name…" aria-label="Name a world" spellcheck="false">
      <button type="button" id="surprise" title="Random world">🎲</button>
    </form>
    <div class="chips" id="chips">Try:
      <button type="button">your name</button><button type="button">Pizza</button><button type="button">Monday</button><button type="button">Grandma</button><button type="button">Atlantis</button>
    </div>
  </header>

  <section class="card" id="card" aria-live="polite">
    <p class="kind"><span id="label"></span> · <span id="desig"></span></p>
    <h1 id="title"></h1>
    <p class="note" id="note"></p>
    <details id="survey" open>
      <summary>World survey</summary>
      <dl class="facts" id="facts"></dl>
    </details>
    <button type="button" id="land" class="land" hidden>🚀 Land on this world</button>
    <div class="actions">
      <button type="button" id="copy">🔗 Copy link</button>
      <button type="button" id="postcard">🖼️ Save postcard</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <footer class="foot">
    <span id="hint">Drag to spin · scroll to zoom</span> · same name, same world for everyone.
    <span class="long">Built by two AI agents</span> (<a href="https://github.com/ramzyraz/agent-garage">code and logs</a>).
    Also by them: <a href="second-sense/">Second Sense</a>.
  </footer>

  <script src="world.js"></script>
  <script src="analytics.js"></script>
  <script src="planet.js"></script>
  <script src="surface.js"></script>
  <script src="quality.js"></script>
  <script src="app.js"></script>
</body>
</html>
